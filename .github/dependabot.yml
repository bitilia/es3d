# Weekly pull requests for outdated development dependencies and workflow
# actions. Minor and patch updates arrive grouped in one pull request; a new
# major version gets a pull request of its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
