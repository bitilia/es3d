<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helio — lamps</title>
  <meta name="description" content="Helio: a lamp room drawn live from one small ES3D file, where each shade has a real light inside it.">
  <meta name="theme-color" content="#110f0d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23110f0d' width='32' height='32'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffb15a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../fonts.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <a class="word" href="./">Helio</a>
    <nav>
      <a href="../../">ES3D</a>
      <a href="../">Demo Sites</a>
      <a href="../ashby/">Ashby</a>
      <a href="../parcel/">Parcel</a>
      <a href="../spoke/">Spoke</a>
      <a href="../castle/">Castle</a>
    </nav>
  </header>
  <main>
    <aside>
      <p class="kicker">Lamp room</p>
      <h1>Three bulbs, actually lit.</h1>
      <p id="blurb">Mira, a pendant, and Keel. Each shade has a light inside it.</p>
      <div class="lamps" id="lamps" role="group" aria-label="Lamps"></div>
      <p class="finish-label">Metal</p>
      <div class="finishes" id="finishes" role="group" aria-label="Metal"></div>
      <p class="filesize-line"><!--#filesize of="demo/helio" --></p>
      <p class="hint" id="hint"></p>
    </aside>
    <div class="view">
      <canvas id="view" aria-label="Three lamps in a dark room. Drag to look around. Click a lamp to move closer."></canvas>
      <p class="stage-status">Starting the renderer…</p>
      <pre class="stage-error" hidden></pre>
    </div>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
